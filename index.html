  <!DOCTYPE html>
  <html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIA - Billetera Digital Elegante</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.20.15/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(50px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes modalPop {
        from { opacity: 0; transform: scale(0.8); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0px); }
      }
      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animate-fadeInUp { animation: fadeInUp 0.8s ease-out forwards; }
      .animate-slideIn { animation: slideIn 0.8s ease-out forwards; }
      .animate-modalPop { animation: modalPop 0.3s ease-out forwards; }
      .animate-float { animation: float 6s ease-in-out infinite; }
      .animate-gradient { animation: gradientBG 15s ease infinite; }
      .hover-scale:hover { transform: scale(1.03); transition: transform 0.3s ease; }
      .smooth-scroll { scroll-behavior: smooth; }
      .carousel-item { transition: opacity 0.5s ease, transform 0.5s ease; }
      .text-gradient {
        background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .dark .bg-gradient-to-br { 
        background: linear-gradient(135deg, #0f172a, #1e293b);
      }
      .dark .bg-white { background: #1e293b; }
      .dark .text-gray-800 { color: #f8fafc; }
      .dark .bg-gray-50 { background: #0f172a; }
      .dark .bg-gray-100 { background: #1e293b; }
      .modal-overlay { backdrop-filter: blur(8px); }
      body {
        font-family: 'Montserrat', sans-serif;
      }
      .font-display {
        font-family: 'Playfair Display', serif;
      }
      .glass-effect {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .dark .glass-effect {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .btn-primary {
        background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        color: white;
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        background: linear-gradient(90deg, #2563eb, #7c3aed);
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      }
      .feature-card {
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .feature-card:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }
      .nav-link {
        position: relative;
      }
      .nav-link:after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: -2px;
        left: 0;
        background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        transition: width 0.3s ease;
      }
      .nav-link:hover:after {
        width: 100%;
      }
      .hero-gradient {
        background: linear-gradient(-45deg, #3b82f6, #8b5cf6, #ec4899, #f59e0b);
        background-size: 400% 400%;
      }
      /* Calendar Specific Styles */
      .calendar-grid {
          display: grid;
          grid-template-columns: repeat(7, 1fr);
          gap: 0.5rem;
      }
      .day-cell {
          padding: 0.75rem;
          border-radius: 0.5rem;
          background-color: rgba(255, 255, 255, 0.05); /* Lighter glass effect */
          min-height: 100px; /* Adjust as needed */
          cursor: pointer;
          transition: all 0.2s ease;
          position: relative;
          overflow: hidden;
      }
      .day-cell:hover {
          background-color: rgba(255, 255, 255, 0.15);
          transform: translateY(-2px);
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      .day-cell.current-month {
          color: #e2e8f0; /* text-gray-200 for current month days */
      }
      .day-cell.other-month {
          color: #94a3b8; /* text-gray-400 for other month days */
          opacity: 0.7;
      }
      .day-cell.selected {
          background-color: #3b82f6; /* blue-500 */
          color: white;
          box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
      }
      .day-number {
          font-weight: 600;
          margin-bottom: 0.5rem;
          display: block;
      }
      .activity-indicator {
          position: absolute;
          bottom: 0.5rem;
          left: 50%;
          transform: translateX(-50%);
          width: 8px;
          height: 8px;
          background-color: #f59e0b; /* amber-500 */
          border-radius: 50%;
      }
      .activity-list {
          max-height: 150px; /* Scrollable activity list in modal */
          overflow-y: auto;
      }

      /* Finance Control Specific Styles */
      .finance-card {
          background-color: rgba(255, 255, 255, 0.05);
          backdrop-filter: blur(5px);
          -webkit-backdrop-filter: blur(5px);
          border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .dark .finance-card {
          background-color: rgba(15, 23, 42, 0.7);
          border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen font-sans smooth-scroll transition-colors duration-300" id="body">
    <div id="root"></div>
    <script type="text/babel">
      const Header = () => {
        const [isDark, setIsDark] = React.useState(false);
        const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);
        
        const toggleTheme = () => {
          document.getElementById('body').classList.toggle('dark');
          setIsDark(!isDark);
        };

        return (
          <header className="glass-effect text-white py-6 sticky top-0 z-50 shadow-xl">
            <div className="container mx-auto flex justify-between items-center px-6 lg:px-12">
              <div className="flex items-center">
                <h1 className="text-3xl font-display font-bold tracking-tighter">
                  <span className="text-gradient">MIA</span>
                </h1>
              </div>
              
              {/* Desktop Navigation */}
              <nav className="hidden md:flex items-center space-x-8">
                <ul className="flex space-x-8">
                  <li>
                    <a href="#home" className="nav-link font-medium hover:text-white transition">
                      Inicio
                    </a>
                  </li>
                  <li>
                    <a href="#features" className="nav-link font-medium hover:text-white transition">
                      Características
                    </a>
                  </li>
                  <li>
                    <a href="#transactions" className="nav-link font-medium hover:text-white transition">
                      Transacciones
                    </a>
                  </li>
                  <li>
                    <a href="#calendar" className="nav-link font-medium hover:text-white transition">
                      Calendario
                    </a>
                  </li>
                  <li>
                    <a href="#finances" className="nav-link font-medium hover:text-white transition">
                      Finanzas
                    </a>
                  </li>
                  <li>
                    <a href="#contact" className="nav-link font-medium hover:text-white transition">
                      Contacto
                    </a>
                  </li>
                </ul>
                
                <div className="flex items-center space-x-4 ml-6">
                  <button onClick={toggleTheme} className="p-2 rounded-full bg-gray-700 hover:bg-gray-600 transition">
                    {isDark ? (
                      <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fillRule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clipRule="evenodd" />
                      </svg>
                    ) : (
                      <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
                      </svg>
                    )}
                  </button>
                  <button className="btn-primary font-medium py-2 px-6 rounded-full">
                    Iniciar Sesión
                  </button>
                </div>
              </nav>
              
              {/* Mobile Menu Button */}
              <button 
                className="md:hidden p-2 rounded-lg bg-gray-800 text-white"
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
              >
                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                </svg>
              </button>
            </div>
            
            {/* Mobile Menu */}
            {mobileMenuOpen && (
              <div className="md:hidden bg-gray-800 dark:bg-gray-900 px-6 py-4">
                <ul className="space-y-4">
                  <li>
                    <a href="#home" className="block font-medium hover:text-blue-400 transition" onClick={() => setMobileMenuOpen(false)}>
                      Inicio
                    </a>
                  </li>
                  <li>
                    <a href="#features" className="block font-medium hover:text-blue-400 transition" onClick={() => setMobileMenuOpen(false)}>
                      Características
                    </a>
                  </li>
                  <li>
                    <a href="#transactions" className="block font-medium hover:text-blue-400 transition" onClick={() => setMobileMenuOpen(false)}>
                      Transacciones
                    </a>
                  </li>
                  <li>
                    <a href="#calendar" className="block font-medium hover:text-blue-400 transition" onClick={() => setMobileMenuOpen(false)}>
                      Calendario
                    </a>
                  </li>
                  <li>
                    <a href="#finances" className="block font-medium hover:text-blue-400 transition" onClick={() => setMobileMenuOpen(false)}>
                      Finanzas
                    </a>
                  </li>
                  <li>
                    <a href="#contact" className="block font-medium hover:text-blue-400 transition" onClick={() => setMobileMenuOpen(false)}>
                      Contacto
                    </a>
                  </li>
                </ul>
                <div className="mt-6 pt-6 border-t border-gray-700 flex justify-between items-center">
                  <button onClick={toggleTheme} className="p-2 rounded-full bg-gray-700 hover:bg-gray-600 transition">
                    {isDark ? '☀️' : '🌙'}
                  </button>
                  <button className="btn-primary font-medium py-2 px-6 rounded-full">
                    Iniciar Sesión
                  </button>
                </div>
              </div>
            )}
          </header>
        );
      };

      const Hero = () => (
        <section id="home" className="hero-gradient text-white py-32 animate-gradient">
          <div className="container mx-auto px-6 lg:px-12">
            <div className="flex flex-col lg:flex-row items-center justify-between">
              <div className="lg:w-1/2 mb-16 lg:mb-0 animate-fadeInUp">
                <h2 className="text-4xl md:text-5xl lg:text-6xl font-display font-bold mb-6 leading-tight">
                  Transforma tu <span className="text-gradient">gestión financiera</span> con MIA
                </h2>
                <p className="text-xl md:text-2xl mb-8 max-w-2xl opacity-90">
                  La plataforma más elegante y segura para administrar tus transacciones con estilo y precisión.
                </p>
                <div className="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4">
                  <button className="btn-primary font-semibold py-4 px-8 rounded-full shadow-xl">
                    ¡Comienza Ahora!
                  </button>
                  <button className="bg-white bg-opacity-10 hover:bg-opacity-20 text-white font-semibold py-4 px-8 rounded-full border border-white border-opacity-20 transition shadow-xl">
                    Ver Demo
                  </button>
                </div>
                <div className="mt-12 flex items-center space-x-6">
                  <div className="flex -space-x-2">
                    <img src="https://randomuser.me/api/portraits/women/44.jpg" className="w-10 h-10 rounded-full border-2 border-white" alt="User" />
                    <img src="https://randomuser.me/api/portraits/men/32.jpg" className="w-10 h-10 rounded-full border-2 border-white" alt="User" />
                    <img src="https://randomuser.me/api/portraits/women/68.jpg" className="w-10 h-10 rounded-full border-2 border-white" alt="User" />
                  </div>
                  <div>
                    <p className="text-sm opacity-80">Únete a más de 50,000 usuarios</p>
                    <div className="flex items-center mt-1">
                      <svg className="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                      </svg>
                      <svg className="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                      </svg>
                      <svg className="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                      </svg>
                      <svg className="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                      </svg>
                      <svg className="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                      </svg>
                      <span className="ml-2 text-sm">4.9/5 (2,500+ reseñas)</span>
                    </div>
                  </div>
                </div>
              </div>
              
              <div className="lg:w-1/2 flex justify-center animate-float">
                <div className="relative">
                  <div className="absolute -top-10 -left-10 w-32 h-32 bg-purple-500 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
                  <div className="absolute -bottom-8 -right-8 w-32 h-32 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000"></div>
                  <div className="absolute top-20 -right-10 w-32 h-32 bg-pink-500 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-4000"></div>
                  
                  <div className="relative glass-effect p-6 rounded-3xl shadow-2xl">
                    <img 
                      src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" 
                      alt="MIA App Preview" 
                      className="rounded-2xl border border-white border-opacity-20 shadow-lg"
                    />
                    <div className="absolute -bottom-6 -right-6 bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-xl">
                      <div className="text-sm font-semibold text-gray-500 dark:text-gray-400">Transferencia</div>
                      <div className="text-2xl font-bold text-gray-800 dark:text-white">+$1,250.00</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      );

      const Features = () => {
        const features = [
          { 
            title: "Pagos Instantáneos", 
            desc: "Transfiere dinero en tiempo real con nuestra interfaz ultraveloz y fluida. Sin esperas, sin complicaciones.", 
            icon: (
              <svg xmlns="http://www.w3.org/2000/svg" className="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
              </svg>
            ),
            color: "bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-300"
          },
          { 
            title: "Seguridad de Élite", 
            desc: "Protegemos tus fondos con encriptación bancaria y autenticación biométrica multicapa.", 
            icon: (
              <svg xmlns="http://www.w3.org/2000/svg" className="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            ),
            color: "bg-purple-100 dark:bg-purple-900 text-purple-600 dark:text-purple-300"
          },
          { 
            title: "Análisis Financiero", 
            desc: "Reportes detallados y predicciones inteligentes para optimizar cada aspecto de tus finanzas.", 
            icon: (
              <svg xmlns="http://www.w3.org/2000/svg" className="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
              </svg>
            ),
            color: "bg-green-100 dark:bg-green-900 text-green-600 dark:text-green-300"
          },
          { 
            title: "Sincronización Total", 
            desc: "Accede desde cualquier dispositivo con sincronización en tiempo real y notificaciones instantáneas.", 
            icon: (
              <svg xmlns="http://www.w3.org/2000/svg" className="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
              </svg>
            ),
            color: "bg-pink-100 dark:bg-pink-900 text-pink-600 dark:text-pink-300"
          },
        ];

        return (
          <section id="features" className="py-20 bg-white dark:bg-gray-900">
            <div className="container mx-auto px-6 lg:px-12">
              <div className="text-center mb-20">
                <span className="text-sm font-semibold tracking-wider uppercase text-blue-600 dark:text-blue-400">
                  Potencia tus finanzas
                </span>
                <h2 className="text-4xl md:text-5xl font-display font-bold mt-2 text-gray-900 dark:text-white">
                  Características <span className="text-gradient">Premium</span>
                </h2>
                <p className="mt-4 max-w-2xl mx-auto text-xl text-gray-600 dark:text-gray-300">
                  Descubre todo lo que MIA puede hacer para simplificar y elevar tu experiencia financiera.
                </p>
              </div>
              
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                {features.map((feature, index) => (
                  <div 
                    key={index} 
                    className={`feature-card bg-gray-50 dark:bg-gray-800 p-8 rounded-2xl ${feature.color} hover:shadow-xl`}
                  >
                    <div className={`inline-flex items-center justify-center w-16 h-16 mb-6 rounded-full ${feature.color.split(' ')[0]} ${feature.color.split(' ')[1]}`}>

              <div className="max-w-4xl mx-auto bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden animate-fadeInUp">

                  <h3 className="text-xl font-semibold text-gray-800 dark:text-white">Últimas transacciones</h3>

                <div className="divide-y divide-gray-200 dark:divide-gray-700">
                  {transactions.map((tx) => (

      };

      // --- Calendar Component ---
      const Calendar = () => {
          const [currentMonth, setCurrentMonth] = React.useState(new Date());
          const [selectedDate, setSelectedDate] = React.useState(null);
          const [activities, setActivities] = React.useState({}); // { 'YYYY-MM-DD': [{ id, text, time, category }] }
          const [showAddActivityModal, setShowAddActivityModal] = React.useState(false);
          const [showViewActivitiesModal, setShowViewActivitiesModal] = React.useState(false);
          const [newActivityText, setNewActivityText] = React.useState('');
          const [newActivityTime, setNewActivityTime] = React.useState('');
          const [newActivityCategory, setNewActivityCategory] = React.useState('general');

          const daysInMonth = (date) => new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
          const firstDayOfMonth = (date) => new Date(date.getFullYear(), date.getMonth(), 1).getDay(); // 0 for Sunday

          const getCalendarDays = () => {
              const year = currentMonth.getFullYear();
              const month = currentMonth.getMonth();
              const numDays = daysInMonth(currentMonth);
              const firstDay = firstDayOfMonth(currentMonth);
              const days = [];

              // Fill with previous month's days
              const prevMonthLastDay = new Date(year, month, 0).getDate();
              for (let i = firstDay; i > 0; i--) {
                  days.push({ day: prevMonthLastDay - i + 1, currentMonth: false, date: new Date(year, month - 1, prevMonthLastDay - i + 1) });
              }

              // Fill with current month's days
              for (let i = 1; i <= numDays; i++) {
                  days.push({ day: i, currentMonth: true, date: new Date(year, month, i) });
              }

              // Fill with next month's days to complete weeks
              let nextMonthDay = 1;
              while (days.length % 7 !== 0) {
                  days.push({ day: nextMonthDay, currentMonth: false, date: new Date(year, month + 1, nextMonthDay) });
                  nextMonthDay++;
              }
              return days;
          };

          const handlePrevMonth = () => {
              setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1));
              setSelectedDate(null); // Clear selected date when changing month
          };

          const handleNextMonth = () => {
              setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1));
              setSelectedDate(null); // Clear selected date when changing month
          };

          const formatDate = (date) => date.toISOString().split('T')[0];

          const handleDayClick = (dateObj) => {
              setSelectedDate(dateObj);
              setShowViewActivitiesModal(true);
          };

          const addActivity = () => {
              if (selectedDate && newActivityText.trim()) {
                  const dateKey = formatDate(selectedDate.date);
                  const newActivity = {
                      id: Date.now(),
                      text: newActivityText.trim(),
                      time: newActivityTime,
                      category: newActivityCategory,
                  };
                  setActivities(prev => ({
                      ...prev,
                      [dateKey]: [...(prev[dateKey] || []), newActivity]
                  }));
                  setNewActivityText('');
                  setNewActivityTime('');
                  setNewActivityCategory('general');
                  setShowAddActivityModal(false);
                  setShowViewActivitiesModal(true); // Re-open view modal to see new activity
              }
          };

          const deleteActivity = (dateKey, activityId) => {
              setActivities(prev => ({
                  ...prev,
                  [dateKey]: prev[dateKey].filter(act => act.id !== activityId)
              }));
          };

          const getMonthName = (date) => {
              return date.toLocaleString('es-ES', { month: 'long', year: 'numeric' });
          };

          const daysOfWeek = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

          return (
              <section id="calendar" className="py-20 bg-white dark:bg-gray-900">
                  <div className="container mx-auto px-6 lg:px-12">
                      <div className="text-center mb-16">
                          <span className="text-sm font-semibold tracking-wider uppercase text-blue-600 dark:text-blue-400">
                              Organiza tu tiempo
                          </span>
                          <h2 className="text-4xl md:text-5xl font-display font-bold mt-2 text-gray-900 dark:text-white">
                              Tu <span className="text-gradient">Calendario</span> Personal
                          </h2>
                          <p className="mt-4 max-w-2xl mx-auto text-xl text-gray-600 dark:text-gray-300">
                              Gestiona tus actividades y eventos importantes de forma sencilla.
                          </p>
                      </div>

                      <div className="max-w-4xl mx-auto glass-effect p-8 rounded-2xl shadow-xl text-gray-800 dark:text-white">
                          <div className="flex justify-between items-center mb-6">
                              <button onClick={handlePrevMonth} className="p-2 rounded-full bg-blue-500 hover:bg-blue-600 text-white transition">
                                  <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
                                  </svg>
                              </button>
                              <h3 className="text-2xl font-bold capitalize">{getMonthName(currentMonth)}</h3>
                              <button onClick={handleNextMonth} className="p-2 rounded-full bg-blue-500 hover:bg-blue-600 text-white transition">
                                  <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                                  </svg>
                              </button>
                          </div>

                          <div className="calendar-grid text-center font-semibold mb-4">
                              {daysOfWeek.map(day => (
                                  <div key={day} className="text-gray-600 dark:text-gray-300">{day}</div>
                              ))}
                          </div>

                          <div className="calendar-grid">
                              {getCalendarDays().map((dayObj, index) => {
                                  const dateKey = formatDate(dayObj.date);
                                  const hasActivities = activities[dateKey] && activities[dateKey].length > 0;
                                  const isSelected = selectedDate && formatDate(selectedDate.date) === dateKey;

                                  return (
                                      <div
                                          key={index}
                                          className={`day-cell ${dayObj.currentMonth ? 'current-month' : 'other-month'} ${isSelected ? 'selected' : ''}`}
                                          onClick={() => handleDayClick(dayObj)}
                                      >
                                          <span className="day-number">{dayObj.day}</span>
                                          {hasActivities && <div className="activity-indicator"></div>}
                                      </div>
                                  );
                              })}
                          </div>
                      </div>

                      {/* Add Activity Modal */}
                      {showAddActivityModal && selectedDate && (
                          <div className="fixed inset-0 bg-black bg-opacity-50 modal-overlay flex items-center justify-center z-50">
                              <div className="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-2xl animate-modalPop w-full max-w-md">
                                  <h3 className="text-2xl font-bold mb-6 text-gray-800 dark:text-white">Añadir Actividad para {selectedDate.date.toLocaleDateString('es-ES')}</h3>
                                  <form onSubmit={(e) => { e.preventDefault(); addActivity(); }}>
                                      <div className="mb-4">
                                          <label htmlFor="activityText" className="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">
                                              Descripción:
                                          </label>
                                          <input
                                              type="text"
                                              id="activityText"
                                              value={newActivityText}
                                              onChange={(e) => setNewActivityText(e.target.value)}
                                              className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 leading-tight focus:outline-none focus:shadow-outline bg-gray-100 dark:bg-gray-700 border-gray-200 dark:border-gray-600"
                                              placeholder="Ej: Reunión con cliente"
                                              required
                                          />
                                      </div>
                                      <div className="mb-4">
                                          <label htmlFor="activityTime" className="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">
                                              Hora (opcional):
                                          </label>
                                          <input
                                              type="time"
                                              id="activityTime"
                                              value={newActivityTime}
                                              onChange={(e) => setNewActivityTime(e.target.value)}
                                              className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 leading-tight focus:outline-none focus:shadow-outline bg-gray-100 dark:bg-gray-700 border-gray-200 dark:border-gray-600"
                                          />
                                      </div>
                                      <div className="mb-6">
                                          <label htmlFor="activityCategory" className="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">
                                              Categoría:
                                          </label>
                                          <select
                                              id="activityCategory"
                                              value={newActivityCategory}
                                              onChange={(e) => setNewActivityCategory(e.target.value)}
                                              className="shadow border rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 leading-tight focus:outline-none focus:shadow-outline bg-gray-100 dark:bg-gray-700 border-gray-200 dark:border-gray-600"
                                          >
                                              <option value="general">General</option>
                                              <option value="trabajo">Trabajo</option>
                                              <option value="personal">Personal</option>
                                              <option value="finanzas">Finanzas</option>
                                          </select>
                                      </div>
                                      <div className="flex justify-end space-x-4">
                                          <button
                                              type="button"
                                              onClick={() => setShowAddActivityModal(false)}
                                              className="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-full transition"
                                          >
                                              Cancelar
                                          </button>
                                          <button
                                              type="submit"
                                              className="btn-primary font-bold py-2 px-4 rounded-full"
                                          >
                                              Añadir
                                          </button>
                                      </div>
                                  </form>
                              </div>
                          </div>
                      )}

                      {/* View Activities Modal */}
                      {showViewActivitiesModal && selectedDate && (
                          <div className="fixed inset-0 bg-black bg-opacity-50 modal-overlay flex items-center justify-center z-50">
                              <div className="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-2xl animate-modalPop w-full max-w-md">
                                  <h3 className="text-2xl font-bold mb-6 text-gray-800 dark:text-white">Actividades para {selectedDate.date.toLocaleDateString('es-ES')}</h3>
                                  <div className="activity-list mb-6">
                                      {(activities[formatDate(selectedDate.date)] && activities[formatDate(selectedDate.date)].length > 0) ? (
                                          activities[formatDate(selectedDate.date)].map((activity) => (
                                              <div key={activity.id} className="flex items-center justify-between p-3 mb-2 bg-gray-100 dark:bg-gray-700 rounded-lg">
                                                  <div>
                                                      <p className="text-gray-800 dark:text-white font-medium">{activity.text}</p>
                                                      <p className="text-sm text-gray-600 dark:text-gray-400">
                                                          {activity.time && `${activity.time} - `}Categoría: {activity.category}
                                                      </p>
                                                  </div>
                                                  <button
                                                      onClick={() => deleteActivity(formatDate(selectedDate.date), activity.id)}
                                                      className="text-red-500 hover:text-red-700 transition"
                                                  >
                                                      <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                                          <path fillRule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm6 0a1 1 0 11-2 0v6a1 1 0 112 0V8z" clipRule="evenodd" />
                                                      </svg>
                                                  </button>
                                              </div>
                                          ))
                                      ) : (
                                          <p className="text-gray-600 dark:text-gray-400">No hay actividades para este día.</p>
                                      )}
                                  </div>
                                  <div className="flex justify-end space-x-4">
                                      <button
                                          onClick={() => { setShowViewActivitiesModal(false); setSelectedDate(null); }}
                                          className="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-full transition"
                                      >
                                          Cerrar
                                      </button>
                                      <button
                                          onClick={() => { setShowViewActivitiesModal(false); setShowAddActivityModal(true); }}
                                          className="btn-primary font-bold py-2 px-4 rounded-full"
                                      >
                                          Añadir Actividad
                                      </button>
                                  </div>
                              </div>
                          </div>
                      )}
                  </div>
              </section>
          );
      };

      // --- Finance Control Component ---
      const FinanceControl = () => {
          const [income, setIncome] = React.useState(1500); // Initial income
          const [expenses, setExpenses] = React.useState([]); // { id, description, amount, date, category }
          const [newExpenseDesc, setNewExpenseDesc] = React.useState('');
          const [newExpenseAmount, setNewExpenseAmount] = React.useState('');
          const [newExpenseCategory, setNewExpenseCategory] = React.useState('Hogar');
          const [showAddExpenseModal, setShowAddExpenseModal] = React.useState(false);

          React.useEffect(() => {
              // Load from localStorage or simulate initial data
              const storedExpenses = JSON.parse(localStorage.getItem('mia_expenses')) || [
                  { id: 1, description: 'Alquiler', amount: 500, date: '2025-05-01', category: 'Hogar' },
                  { id: 2, description: 'Comida', amount: 200, date: '2025-05-05', category: 'Alimentación' },
                  { id: 3, description: 'Transporte', amount: 50, date: '2025-05-10', category: 'Transporte' },
                  { id: 4, description: 'Internet', amount: 30, date: '2025-05-15', category: 'Servicios' },
              ];
              setExpenses(storedExpenses);
          }, []);

          React.useEffect(() => {
              localStorage.setItem('mia_expenses', JSON.stringify(expenses));
          }, [expenses]);

          const totalExpenses = expenses.reduce((sum, exp) => sum + exp.amount, 0);
          const balance = income - totalExpenses;

          const addExpense = () => {
              if (newExpenseDesc.trim() && parseFloat(newExpenseAmount) > 0) {
                  const newExpense = {
                      id: Date.now(),
                      description: newExpenseDesc.trim(),
                      amount: parseFloat(newExpenseAmount),
                      date: new Date().toISOString().split('T')[0],
                      category: newExpenseCategory,
                  };
                  setExpenses([...expenses, newExpense]);
                  setNewExpenseDesc('');
                  setNewExpenseAmount('');
                  setNewExpenseCategory('Hogar');
                  setShowAddExpenseModal(false);
              }
          };

          const deleteExpense = (id) => {
              setExpenses(expenses.filter(exp => exp.id !== id));
          };

          const expenseCategories = ['Hogar', 'Alimentación', 'Transporte', 'Entretenimiento', 'Servicios', 'Otros'];

          return (
              <section id="finances" className="py-20 bg-gray-50 dark:bg-gray-900">
                  <div className="container mx-auto px-6 lg:px-12">
                      <div className="text-center mb-16">
                          <span className="text-sm font-semibold tracking-wider uppercase text-blue-600 dark:text-blue-400">
                              Control absoluto
                          </span>
                          <h2 className="text-4xl md:text-5xl font-display font-bold mt-2 text-gray-900 dark:text-white">
                              Control de <span className="text-gradient">Finanzas</span>
                          </h2>
                          <p className="mt-4 max-w-2xl mx-auto text-xl text-gray-600 dark:text-gray-300">
                              Mantén un registro de tus ingresos y gastos para una salud financiera óptima.
                          </p>
                      </div>

                      <div className="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
                          {/* Summary Card */}
                          <div className="finance-card p-8 rounded-2xl shadow-xl flex flex-col items-center justify-center text-center">
                              <h3 className="text-2xl font-bold mb-4 text-gray-800 dark:text-white">Balance Actual</h3>
                              <p className={`text-5xl font-extrabold ${balance >= 0 ? 'text-green-500' : 'text-red-500'}`}>
                                  ${balance.toFixed(2)}
                              </p>
                              <div className="mt-6 w-full flex justify-around">
                                  <div className="flex flex-col items-center">
                                      <span className="text-sm text-gray-500 dark:text-gray-400">Ingresos</span>
                                      <span className="text-xl font-semibold text-green-600 dark:text-green-400">${income.toFixed(2)}</span>
                                  </div>
                                  <div className="flex flex-col items-center">
                                      <span className="text-sm text-gray-500 dark:text-gray-400">Gastos</span>
                                      <span className="text-xl font-semibold text-red-600 dark:text-red-400">${totalExpenses.toFixed(2)}</span>
                                  </div>
                              </div>
                              <button
                                  onClick={() => setShowAddExpenseModal(true)}
                                  className="btn-primary mt-8 py-3 px-6 rounded-full font-semibold"
                              >
                                  Añadir Gasto
                              </button>
                          </div>

                          {/* Expenses List */}
                          <div className="finance-card p-8 rounded-2xl shadow-xl">
                              <h3 className="text-2xl font-bold mb-6 text-gray-800 dark:text-white">Últimos Gastos</h3>
                              {expenses.length > 0 ? (
                                  <div className="divide-y divide-gray-200 dark:divide-gray-700 max-h-80 overflow-y-auto">
                                      {expenses.map((expense) => (
                                          <div key={expense.id} className="flex justify-between items-center py-3">
                                              <div>
                                                  <p className="text-gray-800 dark:text-white font-medium">{expense.description}</p>
                                                  <p className="text-sm text-gray-500 dark:text-gray-400">{expense.date} - {expense.category}</p>
                                              </div>
                                              <div className="flex items-center space-x-3">
                                                  <span className="text-lg font-semibold text-red-600 dark:text-red-400">-${expense.amount.toFixed(2)}</span>
                                                  <button
                                                      onClick={() => deleteExpense(expense.id)}
                                                      className="text-gray-400 hover:text-red-500 transition"
                                                      title="Eliminar gasto"
                                                  >
                                                      <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                                          <path fillRule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm6 0a1 1 0 11-2 0v6a1 1 0 112 0V8z" clipRule="evenodd" />
                                                      </svg>
                                                  </button>
                                              </div>
                                          </div>
                                      ))}
                                  </div>
                              ) : (
                                  <p className="text-gray-600 dark:text-gray-400">No hay gastos registrados aún.</p>
                              )}
                          </div>
                      </div>

                      {/* Add Expense Modal */}
                      {showAddExpenseModal && (
                          <div className="fixed inset-0 bg-black bg-opacity-50 modal-overlay flex items-center justify-center z-50">
                              <div className="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-2xl animate-modalPop w-full max-w-md">
                                  <h3 className="text-2xl font-bold mb-6 text-gray-800 dark:text-white">Añadir Nuevo Gasto</h3>

                                              id="expenseDesc"
                                              value={newExpenseDesc}
                                              onChange={(e) => setNewExpenseDesc(e.target.value)}
                                              className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 leading-tight focus:outline-none focus:shadow-outline bg-gray-100 dark:bg-gray-700 border-gray-200 dark:border-gray-600"
                                              placeholder="Ej: Café y snacks"
                                              required
                                          />
                                      </div>
                                      <div className="mb-4">
                                          <label htmlFor="expenseAmount" className="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">
                                              Monto:
                                          </label>
                                          <input
                                              type="number"
                                              id="expenseAmount"
                                              value={newExpenseAmount}
                                              onChange={(e) => setNewExpenseAmount(e.target.value)}
                                              className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 leading-tight focus:outline-none focus:shadow-outline bg-gray-100 dark:bg-gray-700 border-gray-200 dark:border-gray-600"
                                              placeholder="Ej: 15.75"
                                              step="0.01"
                                              required
                                          />
                                      </div>
                                      <div className="mb-6">
                                          <label htmlFor="expenseCategory" className="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">
                                              Categoría:
                                          </label>
                                          <select
                                              id="expenseCategory"
                                              value={newExpenseCategory}
                                              onChange={(e) => setNewExpenseCategory(e.target.value)}
                                              className="shadow border rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 leading-tight focus:outline-none focus:shadow-outline bg-gray-100 dark:bg-gray-700 border-gray-200 dark:border-gray-600"
                                          >
                                              {expenseCategories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                          </select>
                                      </div>
                                      <div className="flex justify-end space-x-4">
                                          <button
                                              type="button"
                                              onClick={() => setShowAddExpenseModal(false)}
                                              className="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-full transition"
                                          >
                                              Cancelar
                                          </button>
                                          <button
                                              type="submit"
                                              className="btn-primary font-bold py-2 px-4 rounded-full"
                                          >
                                              Añadir Gasto
                                          </button>
                                      </div>
                                  </form>
                              </div>
                          </div>
                      )}
                  </div>
              </section>
          );
      };

      const Contact = () => {
        const [formData, setFormData] = React.useState({ name: '', email: '', message: '' });
        const [errors, setErrors] = React.useState({ name: '', email: '', message: '' });
        const [showModal, setShowModal] = React.useState(false);
        const [isSubmitting, setIsSubmitting] = React.useState(false);

        const validateForm = () => {
          let valid = true;
          const newErrors = { name: '', email: '', message: '' };

          if (!formData.name || formData.name.length < 3) {
            newErrors.name = 'El nombre debe tener al menos 3 caracteres';
            valid = false;
          }
          
          if (!formData.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) {
            newErrors.email = 'Ingresa un correo electrónico válido';
            valid = false;
          }
          
          if (!formData.message || formData.message.length < 10) {
            newErrors.message = 'El mensaje debe tener al menos 10 caracteres';
            valid = false;
          }
          
          if (formData.message.length > 500) {
            newErrors.message = 'El mensaje no puede exceder los 500 caracteres';
            valid = false;
          }

          setErrors(newErrors);
          return valid;
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          if (validateForm()) {
            setIsSubmitting(true);
            // Simulate API call
            setTimeout(() => {
              setShowModal(true);
              setIsSubmitting(false);
            }, 1500);
          }
        };

        const handleChange = (e) => {
          setFormData({ ...formData, [e.target.name]: e.target.value });
        };

        const closeModal = () => {
          setShowModal(false);
          setFormData({ name: '', email: '', message: '' });
          setErrors({ name: '', email: '', message: '' });
        };

        return (
          <section id="contact" className="py-20 bg-white dark:bg-gray-900">
            <div className="container mx-auto px-6 lg:px-12">
              <div className="text-center mb-16">
                <span className="text-sm font-semibold tracking-wider uppercase text-blue-600 dark:text-blue-400">
                  Estamos aquí para ayudarte
                </span>
                <h2 className="text-4xl md:text-5xl font-display font-bold mt-2 text-gray-900 dark:text-white">
                  Contácta a nuestro <span className="text-gradient">equipo</span>
                </h2>
                <p className="mt-4 max-w-2xl mx-auto text-xl text-gray-600 dark:text-gray-300">
                  ¿Tienes preguntas? Escríbenos y te responderemos en menos de 24 horas.
                </p>
              </div>
              
              <div className="max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12">
                <div className="bg-gray-50 dark:bg-gray-800 p-8 rounded-2xl shadow-xl animate-fadeInUp">
                  <h3 className="text-2xl font-bold mb-6 text-gray-800 dark:text-white">Información de contacto</h3>
                  
                  <div className="space-y-6">
                    <div className="flex items-start">
                      <div className="flex-shrink-0 bg-blue-100 dark:bg-blue-900 p-3 rounded-lg text-blue-600 dark:text-blue-300">
                        <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                        </svg>
                      </div>
                      <div className="ml-4">
                        <h4 className="text-lg font-medium text-gray-800 dark:text-white">Teléfono</h4>
                        <p className="text-gray-600 dark:text-gray-300">+1 (555) 123-4567</p>
                      </div>
                    </div>
                    
                    <div className="flex items-start">
                      <div className="flex-shrink-0 bg-purple-100 dark:bg-purple-900 p-3 rounded-lg text-purple-600 dark:text-purple-300">
                        <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                      </div>
                      <div className="ml-4">
                        <h4 className="text-lg font-medium text-gray-800 dark:text-white">Email</h4>
                        <p className="text-gray-600 dark:text-gray-300">soporte@miafinance.com</p>
                      </div>
                    </div>
                    
                    <div className="flex items-start">
                      <div className="flex-shrink-0 bg-green-100 dark:bg-green-900 p-3 rounded-lg text-green-600 dark:text-green-300">
                        <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                      </div>
                      <div className="ml-4">
                        <h4 className="text-lg font-medium text-gray-800 dark:text-white">Oficina</h4>
                        <p className="text-gray-600 dark:text-gray-300">Av. Principal 1234, Buenos Aires, Argentina</p>
                      </div>
                    </div>
                  </div>
                  
                  <div className="mt-8">
                    <h4 className="text-lg font-medium mb-4 text-gray-800 dark:text-white">Síguenos</h4>
                    <div className="flex space-x-4">
                      <a href="#" className="bg-gray-200 dark:bg-gray-700 p-3 rounded-full text-gray-700 dark:text-gray-300 hover:bg-blue-100 hover:text-blue-600 dark:hover:bg-blue-900 dark:hover:text-blue-300 transition">
                        <svg className="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                          <path d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-7.719-2.165-10.148-5.144-1.29 2.213-.669" />
                        </svg>
                      </a>
                    </div>
                  </div>
                </div>
                
                <div className="bg-gray-50 dark:bg-gray-800 p-8 rounded-2xl shadow-xl animate-slideIn">
                  <h3 className="text-2xl font-bold mb-6 text-gray-800 dark:text-white">Envíanos un mensaje</h3>
                  <form onSubmit={handleSubmit}>
                    <div className="mb-4">
                      <label htmlFor="name" className="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">
                        Nombre Completo:
                      </label>
                      <input
                        type="text"
                        id="name"
                        name="name"
                        value={formData.name}
                        onChange={handleChange}
                        className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 leading-tight focus:outline-none focus:shadow-outline bg-gray-100 dark:bg-gray-700 border-gray-200 dark:border-gray-600"
                        placeholder="Tu nombre"
                      />
                      {errors.name && <p className="text-red-500 text-xs italic mt-1">{errors.name}</p>}
                    </div>
                    <div className="mb-4">
                      <label htmlFor="email" className="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">
                        Correo Electrónico:
                      </label>
                      <input
                        type="email"
                        id="email"
                        name="email"
                        value={formData.email}
                        onChange={handleChange}
                        className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 leading-tight focus:outline-none focus:shadow-outline bg-gray-100 dark:bg-gray-700 border-gray-200 dark:border-gray-600"
                        placeholder="tu@ejemplo.com"
                      />
                      {errors.email && <p className="text-red-500 text-xs italic mt-1">{errors.email}</p>}
                    </div>
                    <div className="mb-6">
                      <label htmlFor="message" className="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">
                        Mensaje:
                      </label>
                      <textarea
                        id="message"
                        name="message"
                        value={formData.message}
                        onChange={handleChange}
                        rows="5"
                        className="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 leading-tight focus:outline-none focus:shadow-outline bg-gray-100 dark:bg-gray-700 border-gray-200 dark:border-gray-600"
                        placeholder="Escribe tu mensaje aquí..."
                      ></textarea>
                      {errors.message && <p className="text-red-500 text-xs italic mt-1">{errors.message}</p>}
                    </div>
                    <button
                      type="submit"
                      className="btn-primary font-bold py-3 px-6 rounded-full w-full"
                      disabled={isSubmitting}
                    >
                      {isSubmitting ? 'Enviando...' : 'Enviar Mensaje'}
                    </button>
                  </form>
                </div>
              </div>
            </div>

            {/* Submission Modal */}
            {showModal && (
              <div className="fixed inset-0 bg-black bg-opacity-50 modal-overlay flex items-center justify-center z-50">
                <div className="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-2xl animate-modalPop text-center w-full max-w-sm">
                  <div className="flex justify-center mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" className="h-16 w-16 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                  </div>
                  <h3 className="text-2xl font-bold mb-3 text-gray-800 dark:text-white">¡Mensaje Enviado!</h3>
                  <p className="text-gray-600 dark:text-gray-300 mb-6">
                    Gracias por contactarnos. Te responderemos pronto.
                  </p>
                  <button
                    onClick={closeModal}
                    className="btn-primary font-bold py-2 px-5 rounded-full"
                  >
                    Entendido
                  </button>
                </div>
              </div>
            )}
          </section>
        );
      };

      const Footer = () => (
        <footer className="bg-gray-800 dark:bg-gray-950 text-white py-12">
          <div className="container mx-auto px-6 lg:px-12 grid grid-cols-1 md:grid-cols-3 gap-10">
            <div className="text-center md:text-left">
              <h3 className="text-2xl font-display font-bold text-gradient mb-4">MIA</h3>
              <p className="text-gray-400 leading-relaxed">
                Tu billetera digital elegante y segura para una vida financiera sin límites.
              </p>
              <div className="flex mt-6 space-x-4 justify-center md:justify-start">
                <a href="#" className="text-gray-400 hover:text-white transition">
                  <svg className="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-7.719-2.165-10.148-5.144-1.29 2.213-.669 3.992 1.047 5.266-1.78-.053-3.44-.546-4.885-1.346v.074c0 3.265 2.316 5.992 5.393 6.64-.53.145-1.077.222-1.64.222-.402 0-.799-.039-1.189-.111.865 2.693 3.391 4.653 6.356 4.717-2.289 1.791-5.167 2.875-8.305 2.875-.54 0-1.07-.033-1.59-.092 3.738 2.39 8.163 3.784 12.936 3.784 15.552 0 24-12.972 24-24.568v-.526c1.025-.746 1.902-1.658 2.607-2.712z" />
                  </svg>
                </a>
                <a href="#" className="text-gray-400 hover:text-white transition">
                  <svg className="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.77 1.624 4.902 4.902.058 1.266.07 1.646.07 4.85s-.012 3.584-.07 4.85c-.132 3.252-1.608 4.77-4.902 4.902-1.266.058-1.646.07-4.85.07s-3.584-.012-4.85-.07c-3.252-.132-4.77-1.608-4.902-4.902-.058-1.266-.07-1.646-.07-4.85s.012-3.584.07-4.85c.132-3.252 1.608-4.77 4.902-4.902 1.266-.058 1.646-.07 4.85-.07zm0 2.163c-3.262 0-3.676.014-4.942.072-2.857.132-3.967 1.243-4.099 4.099-.058 1.266-.072 1.679-.072 4.942s.014 3.676.072 4.942c.132 2.857 1.243 3.967 4.099 4.099 1.266.058 1.679.072 4.942.072s3.676-.014 4.942-.072c2.857-.132 3.967-1.243 4.099-4.099.058-1.266.072-1.679.072-4.942s-.014-3.676-.072-4.942c-.132-2.857-1.243-3.967-4.099-4.099-1.266-.058-1.679-.072-4.942-.072zm0 3.655a4.182 4.182 0 100 8.364 4.182 4.182 0 000-8.364zm0 2.163a2.019 2.019 0 110 4.038 2.019 2.019 0 010-4.038zm6.538-2.585a.777.777 0 100 1.554.777.777 0 000-1.554z" />
                  </svg>
                </a>
                <a href="#" className="text-gray-400 hover:text-white transition">
                  <svg className="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M.057 1.954c.145-.589.754-.969 1.343-1.114 1.21-.29 2.42-.435 3.63-.435h17.973c.589 0 1.198.38 1.343.969.145.589-.224 1.29-.813 1.435-1.21.29-2.42.435-3.63.435h-17.973c-.589 0-1.198-.38-1.343-.969-.145-.589.224-1.29.813-1.435zm0 6c.145-.589.754-.969 1.343-1.114 1.21-.29 2.42-.435 3.63-.435h17.973c.589 0 1.198.38 1.343.969.145.589-.224 1.29-.813 1.435-1.21.29-2.42.435-3.63.435h-17.973c-.589 0-1.198-.38-1.343-.969-.145-.589.224-1.29.813-1.435zm0 6c.145-.589.754-.969 1.343-1.114 1.21-.29 2.42-.435 3.63-.435h17.973c.589 0 1.198.38 1.343.969.145.589-.224 1.29-.813 1.435-1.21.29-2.42.435-3.63.435h-17.973c-.589 0-1.198-.38-1.343-.969-.145-.589.224-1.29.813-1.435zm0 6c.145-.589.754-.969 1.343-1.114 1.21-.29 2.42-.435 3.63-.435h17.973c.589 0 1.198.38 1.343.969.145.589-.224 1.29-.813 1.435-1.21.29-2.42.435-3.63.435h-17.973c-.589 0-1.198-.38-1.343-.969-.145-.589.224-1.29.813-1.435z" />
                  </svg>
                </a>
              </div>
            </div>
            <div className="text-center md:text-left">
              <h4 className="text-xl font-semibold mb-4">Enlaces Rápidos</h4>
              <ul className="space-y-2 text-gray-400">
                <li><a href="#features" className="hover:text-white transition">Características</a></li>
                <li><a href="#transactions" className="hover:text-white transition">Transacciones</a></li>
                <li><a href="#calendar" className="hover:text-white transition">Calendario</a></li>
                <li><a href="#finances" className="hover:text-white transition">Finanzas</a></li>
                <li><a href="#contact" className="hover:text-white transition">Contacto</a></li>
              </ul>
            </div>
            <div className="text-center md:text-left">
              <h4 className="text-xl font-semibold mb-4">Legal</h4>
              <ul className="space-y-2 text-gray-400">
                <li><a href="#" className="hover:text-white transition">Política de Privacidad</a></li>
                <li><a href="#" className="hover:text-white transition">Términos de Servicio</a></li>
                <li><a href="#" className="hover:text-white transition">Política de Cookies</a></li>
              </ul>
            </div>
          </div>
          <div className="container mx-auto px-6 lg:px-12 text-center text-gray-500 mt-10 border-t border-gray-700 pt-8">
            <p>&copy; {new Date().getFullYear()} MIA. Todos los derechos reservados.</p>
          </div>
        </footer>
      );

      const App = () => (
        <div>
          <Header />
          <main>
            <Hero />
            <Features />
            <Transactions />
            <Calendar />
            <FinanceControl />
            <Contact />
          </main>
          <Footer />
        </div>
      );

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
  </html>
